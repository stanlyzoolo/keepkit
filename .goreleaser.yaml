# GoReleaser config — builds cross-platform binaries, cuts the GitHub Release,
# and publishes/updates the Homebrew formula in stanlyzoolo/homebrew-apps.
# Run locally with `goreleaser release --snapshot --clean` to dry-run (no publish).
version: 2

project_name: keepkit

before:
  hooks:
    - go mod tidy

builds:
  - id: keepkit
    main: .
    binary: keepkit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    # {{ .Tag }} keeps the leading "v" (e.g. v1.2.3) so `keepkit --version`
    # output stays identical to the pre-GoReleaser releases and a keepkit
    # tracking itself still parses its own version.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # matches the old workflow: no windows/arm64 build
      - goos: windows
        goarch: arm64

archives:
  - id: keepkit
    # umputun-style names: darwin→macos, amd64→x86_64 (cosmetic; the URLs
    # in the generated formula follow whatever this produces).
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  # Sorts alphabetically by message, not chronologically — deliberate: scoped
  # subjects like "feat(model):" cluster together inside their group.
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
      - "^ci"
      - "^build"
      - "Merge pull request"
      - "Merge branch"
      - "go mod tidy"
  groups:
    # With `use: github` each line is SHA-prefixed, so a group regexp has to
    # tolerate a prefix (^.*?) — filters.exclude above anchors on the raw
    # message instead, which is why those patterns start at ^.
    - title: New features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 200
    # No regexp: the catch-all. An off-nomenclature subject (refactor:, perf:,
    # or none at all) stays visible here instead of silently vanishing.
    - title: Other changes
      order: 999

release:
  github:
    owner: stanlyzoolo
    name: keepkit
  # The Install block v0.1.0 carried by hand, now stamped onto every release.
  # {{ .Tag }} is the only template expression here on purpose — `goreleaser
  # check` does not validate templates, so a typo surfaces as a failed release
  # job after the tag is already pushed. .Tag keeps the leading "v", so the
  # `go install` line names the real released tag.
  #
  # Inline code, not a fenced block: this body is also what keepkit renders in
  # panel [2], where markdownToLines drops inline backticks and the commands
  # read as prose — a fence would instead land on the card's code plate and
  # break the sentence across three blocks.
  footer: |
    ## Install

    `brew install stanlyzoolo/apps/keepkit`, or
    `go install github.com/stanlyzoolo/keepkit@{{ .Tag }}`, or grab an archive above.

brews:
  - name: keepkit
    repository:
      owner: stanlyzoolo
      name: homebrew-apps
      # PAT with write access to the tap repo, set as a secret in THIS repo.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/stanlyzoolo/keepkit"
    description: "Lightweight TUI for tracking versions of your favorite tools"
    license: MIT
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    install: |
      bin.install "keepkit"
    test: |
      system "#{bin}/keepkit", "--version"
